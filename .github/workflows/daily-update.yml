name: Daily profile update

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC (11:17 Pakistan time)
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Recent Activity section
        run: node scripts/update-readme.js
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit as you (so it counts on your contribution graph)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          ID=$(gh api "users/$OWNER" --jq .id)
          git config user.name "$OWNER"
          git config user.email "${ID}+${OWNER}@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "docs: daily profile update ($(date -u +%F))"
          git push
